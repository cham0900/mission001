<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SECRET — ลองเล่นดูสิ 😈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
:root{--coin:#ffd700;--green:#00e060;--red:#ff3355;--panel:rgba(8,0,20,0.92);--pixel:'Press Start 2P',monospace;--mono:'Share Tech Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#4488ee;min-height:100vh;font-family:var(--pixel);overflow-x:hidden;color:#1a0a00;}
.clouds{position:fixed;top:0;left:0;width:100%;height:180px;pointer-events:none;z-index:0;}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:0.9;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.cloud.c1{width:100px;height:32px;top:28px;animation:fc 20s linear infinite;}
.cloud.c1::before{width:52px;height:52px;top:-24px;left:12px;}
.cloud.c1::after{width:36px;height:36px;top:-16px;left:48px;}
.cloud.c2{width:72px;height:24px;top:68px;animation:fc 28s linear infinite;animation-delay:-10s;}
.cloud.c2::before{width:36px;height:36px;top:-18px;left:8px;}
.cloud.c2::after{width:26px;height:26px;top:-12px;left:34px;}
.cloud.c3{width:120px;height:38px;top:18px;animation:fc 17s linear infinite;animation-delay:-6s;}
.cloud.c3::before{width:62px;height:62px;top:-30px;left:16px;}
.cloud.c3::after{width:46px;height:46px;top:-20px;left:60px;}
@keyframes fc{from{left:-200px;}to{left:110vw;}}
.gnd{position:fixed;bottom:0;left:0;width:100%;height:56px;z-index:1;background:repeating-linear-gradient(90deg,#c84b11 0,#c84b11 60px,#8b2e00 60px,#8b2e00 62px);border-top:4px solid #8b2e00;}
.pipe{position:fixed;bottom:56px;z-index:2;}.pb{width:52px;background:#00a800;border-left:6px solid #006d00;border-right:6px solid #00cc00;}
.pt{width:66px;height:18px;background:#00a800;border:4px solid #006d00;border-radius:4px 4px 0 0;margin-left:-7px;}
.pipe1{left:4%;}.pipe1 .pb{height:80px;}.pipe2{right:6%;}.pipe2 .pb{height:110px;}
.wrap{position:relative;z-index:10;max-width:840px;margin:0 auto;padding:20px 14px 120px;}
.page-title{text-align:center;margin-bottom:6px;margin-top:6px;}
.page-title h1{font-family:var(--pixel);font-size:clamp(12px,2.8vw,18px);color:#fff;text-shadow:3px 3px 0 #c00,5px 5px 0 rgba(0,0,0,0.35);letter-spacing:2px;line-height:1.7;}
.page-title .sub{font-family:var(--pixel);font-size:clamp(6px,1.4vw,9px);color:var(--coin);text-shadow:1px 1px 0 #7a5000;margin-top:8px;letter-spacing:1px;}
.coin-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto;background:var(--panel);border:3px solid var(--coin);border-radius:4px;padding:7px 18px;width:fit-content;}
.coin-bar .lbl{font-family:var(--pixel);font-size:7px;color:var(--coin);}
.coin-bar .val{font-family:var(--pixel);font-size:10px;color:#fff;}
.pbar-wrap{margin:14px 0 0;text-align:center;font-family:var(--pixel);font-size:7px;color:var(--coin);}
.pbar{width:100%;height:12px;background:rgba(0,0,0,0.5);border:2px solid rgba(255,215,0,0.3);border-radius:2px;margin-top:5px;overflow:hidden;}
.pfill{height:100%;background:var(--coin);transition:width 0.4s;}
.missions{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.mcard{background:var(--panel);border:3px solid rgba(255,215,0,0.3);border-radius:6px;overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.mcard:hover{border-color:var(--coin);box-shadow:0 0 16px rgba(255,215,0,0.2);}
.mcard.done{border-color:#00e060;box-shadow:0 0 10px rgba(0,224,96,0.18);}
.mcard-hdr{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,215,0,0.06);border-bottom:2px solid rgba(255,215,0,0.1);cursor:pointer;user-select:none;}
.mcard-hdr:hover{background:rgba(255,215,0,0.12);}
.mbadge{font-family:var(--pixel);font-size:7px;background:var(--coin);color:#3a2000;padding:3px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0;}
.mbadge.done{background:var(--green);color:#003a12;}
.mname{font-family:var(--pixel);font-size:clamp(6px,1.3vw,8px);color:#fff;flex:1;line-height:1.6;}
.mbody{padding:0 14px 12px;display:none;}
.mbody.open{display:block;}
.diff{font-family:var(--pixel);font-size:7px;color:#ff6b6b;margin:9px 0 5px;letter-spacing:1px;}
.gw{background:#000;border:3px solid rgba(255,215,0,0.28);border-radius:4px;overflow:hidden;position:relative;margin:8px 0;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:100%;}
.gui{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(255,215,0,0.05);border-top:2px solid rgba(255,215,0,0.13);}
.ustat{font-family:var(--pixel);font-size:7px;color:var(--coin);}.ustat span{color:#fff;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.bmario{font-family:var(--pixel);font-size:7px;background:var(--coin);color:#3a2000;border:none;border-radius:3px;padding:7px 14px;cursor:pointer;letter-spacing:1px;transition:transform .1s,box-shadow .1s;box-shadow:0 4px 0 #7a5000;}
.bmario:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7a5000;}
.bmario:active{transform:translateY(2px);box-shadow:0 2px 0 #7a5000;}
.bmario.red{background:#ff3355;box-shadow:0 4px 0 #8b0020;color:#fff;}
.bmario.red:hover{box-shadow:0 6px 0 #8b0020;}
.instr{font-family:var(--pixel);font-size:6px;color:rgba(255,215,0,0.65);line-height:2.2;margin:6px 0;letter-spacing:.5px;}
.instr b{color:#fff;}
.hint-box{background:rgba(0,255,100,0.07);border:2px solid var(--green);border-radius:4px;padding:10px 14px;margin-top:10px;display:none;}
.hint-box.show{display:block;}
.hint-lbl{font-family:var(--pixel);font-size:6px;color:var(--green);margin-bottom:5px;letter-spacing:2px;}
.hint-val{font-family:var(--mono);font-size:13px;color:#fff;letter-spacing:2px;}
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--coin);color:#3a2000;font-family:var(--pixel);font-size:8px;padding:9px 18px;border-radius:4px;z-index:9999;animation:npop .18s ease;box-shadow:0 4px 0 #7a5000;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center;}
.notif.evil{background:#ff3355;color:#fff;box-shadow:0 4px 0 #8b0020;}
@keyframes npop{from{transform:translateX(-50%) scale(0.6);}to{transform:translateX(-50%) scale(1);}}
.dpad{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:7px;}
.dpad-row{display:flex;gap:2px;}
.dpbtn{width:42px;height:42px;background:rgba(255,215,0,0.12);border:2px solid rgba(255,215,0,0.35);border-radius:4px;font-size:13px;color:var(--coin);cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;}
.dpbtn:active{background:rgba(255,215,0,0.32);}
.dpempty{width:42px;height:42px;}
.back-link{display:block;text-align:center;margin-top:16px;font-family:var(--pixel);font-size:7px;color:rgba(255,215,0,0.5);cursor:pointer;letter-spacing:1px;text-decoration:none;}
.back-link:hover{color:var(--coin);}
</style>
</head>
<body>
<div class="clouds"><div class="cloud c1"></div><div class="cloud c2" style="animation-delay:-7s"></div><div class="cloud c3" style="animation-delay:-14s"></div></div>
<div class="pipe pipe1"><div class="pt"></div><div class="pb"></div></div>
<div class="pipe pipe2"><div class="pt"></div><div class="pb"></div></div>
<div class="gnd"></div>
<div class="wrap">
  <div class="page-title"><h1>★ ลองเล่นดูสิ 😈 ★</h1><div class="sub">จะมีคำใบ้ให้เพิ่มไหมนะ? &nbsp;|&nbsp; โชคดีนะ :)</div></div>
  <div class="coin-bar"><span class="lbl">CLEAR</span><span class="val" id="gDone">0</span><span class="lbl">/5</span><span style="width:1px;height:18px;background:rgba(255,215,0,0.3);display:inline-block;"></span><span class="lbl">COINS</span><span class="val" id="gCoins">0</span></div>
  <div class="pbar-wrap">WORLD PROGRESS<div class="pbar"><div class="pfill" id="gBar" style="width:0%"></div></div></div>
  <div class="missions" id="mList"></div>
  <a class="back-link" href="index.html">← BACK TO HQ</a>
</div>
<script>
const SK='smv3';let sv={done:[],coins:0};
try{const s=localStorage.getItem(SK);if(s)sv=JSON.parse(s);}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(sv));}catch(e){}}
function gUp(){document.getElementById('gDone').textContent=sv.done.length;document.getElementById('gCoins').textContent=sv.coins;document.getElementById('gBar').style.width=(sv.done.length/5*100)+'%';}
function notif(msg,evil){
  document.querySelectorAll('.notif').forEach(n=>n.remove());
  const n=document.createElement('div');n.className='notif'+(evil?' evil':'');n.textContent=msg;
  document.body.appendChild(n);setTimeout(()=>n.remove(),2800);
}
const MS=[
  {id:1,name:'WORLD 1\nง่ายมากเลย ← →',diff:'★☆☆☆☆  EASY (จริงๆนะ)',hint:'',hintLbl:'',noHint:true,coins:5,instr:'เก็บดาว 5 ดวง\nปุ่มซ้ายขวา... ปกติหรือเปล่า? 🤔'},
  {id:2,name:'WORLD 2\nแพลตฟอร์มชอบหายตัว 😐',diff:'★★★☆☆  MEDIUM',hint:'คำใบ้ #2 : สีของ Flame... "PURPLE"',hintLbl:'SECRET INTEL #2',coins:10,instr:'ยืนบนแพลตฟอร์มนานเกิน = มันหล่น\nดาวบางดวงวิ่งหนีด้วย\nกูมบา invisible — แต่มีเงา'},
  {id:3,name:'WORLD 3\nControls... ปกติดีนะ? 😇',diff:'★★★★☆  HARD',hint:'',hintLbl:'',noHint:true,coins:15,instr:'ปุ่มสลับทุก ~4 วิ ไม่มีแจ้งเตือน\nดาววิ่งหนี + กูมบาเยอะขึ้นเรื่อยๆ\nเก็บดาว 6 ดวง — ขอให้โชคดี'},
  {id:4,name:'WORLD 4\nดาวปลอม = ระเบิด 💥',diff:'★★★★☆  VERY HARD',hint:'คำใบ้ #4 : ตัวเลข F1 ของ Pierre Gasly...',hintLbl:'SECRET INTEL #4',coins:20,instr:'ดาวกะพริบเร็ว = ปลอม → ระเบิดหัก 1 ชีวิต\nดาวกะพริบช้า = จริง เก็บ 5 ดวง\nความเร็วสูงมาก + goombas'},
  {id:5,name:'WORLD 5\nBOSS + ทุกอย่างพร้อมกัน 😈',diff:'★★★★★  NIGHTMARE',hint:'คำใบ้ #5 : รวมทุกอย่าง... "VONGOLA"',hintLbl:'★ SECRET INTEL #5 ★',coins:30,instr:'Bowser 5 HP | ลูกไฟ | Controls สลับ\nแพลตฟอร์มหล่น | แรงโน้มถ่วงพลิก\nดาวปลอมระเบิด | Goomba invisible 2 ชีวิต'}
];
let openCard=null;const gStates={},aLoops={};
function buildCards(){
  const list=document.getElementById('mList');list.innerHTML='';
  MS.forEach(m=>{
    const done=sv.done.includes(m.id);const c=document.createElement('div');c.className='mcard'+(done?' done':'');c.id='mc'+m.id;
    c.innerHTML=`<div class="mcard-hdr" onclick="tog(${m.id})"><div class="mbadge ${done?'done':''}">${done?'CLEAR':'M'+m.id}</div><div class="mname">${m.name.replace('\n','<br>')}</div><div style="font-family:var(--pixel);font-size:9px;color:var(--coin);flex-shrink:0">${done?'✓':'▼'}</div></div>
    <div class="mbody" id="mb${m.id}"><div class="diff">${m.diff}</div><div class="instr">${m.instr.replace(/\n/g,'<br>')}</div>
    <div class="gw" id="gw${m.id}"></div>
    <div class="gui"><div class="ustat">★ <span id="sc${m.id}">0</span></div><div class="ustat">♥ <span id="lv${m.id}">3</span></div><div class="ustat">⏱ <span id="tm${m.id}">--</span></div><div class="ustat" id="xt${m.id}" style="color:#ff6b6b"></div></div>
    <div class="btn-row"><button class="bmario" onclick="startM(${m.id})">▶ START</button><button class="bmario red" onclick="restartM(${m.id})">↺ RESTART</button>${m.id===3?'<button class="bmario" style="background:#1a0a2e;box-shadow:0 4px 0 #0a0014;color:#1a0a2e;border:2px solid #2a1a4e;font-size:5px" onclick="cheatM3()" title="??">· · ·</button>':''}</div>
    ${m.noHint?'':`<div class="hint-box ${done?'show':''}" id="hb${m.id}"><div class="hint-lbl">◈ ${m.hintLbl}</div><div class="hint-val">${m.hint}</div></div>`}</div>`;
    list.appendChild(c);
  });gUp();
}
function tog(id){if(openCard===id){document.getElementById('mb'+id).classList.remove('open');openCard=null;}else{if(openCard)document.getElementById('mb'+openCard).classList.remove('open');document.getElementById('mb'+id).classList.add('open');openCard=id;if(!gStates[id])startM(id);}}
function stopM(id){if(aLoops[id]){cancelAnimationFrame(aLoops[id]);aLoops[id]=null;}}
function restartM(id){stopM(id);gStates[id]=null;const w=document.getElementById('gw'+id);if(w)w.innerHTML='';startM(id);}
function startM(id){stopM(id);const m=MS.find(x=>x.id===id);if(!m)return;const w=document.getElementById('gw'+id);if(!w)return;w.innerHTML='';const cv=document.createElement('canvas');cv.width=640;cv.height=300;w.appendChild(cv);addDpad(w,id);const ctx=cv.getContext('2d');[buildM1,buildM2,buildM3,buildM4,buildM5][id-1](cv,ctx,id);}
function clearM(id){stopM(id);if(!sv.done.includes(id)){sv.done.push(id);sv.coins+=MS.find(x=>x.id===id).coins;persist();}const m=MS.find(x=>x.id===id);if(!m.noHint){const hb=document.getElementById('hb'+id);if(hb)hb.classList.add('show');}document.getElementById('mc'+id).classList.add('done');const b=document.querySelector('#mc'+id+' .mbadge');if(b){b.textContent='CLEAR';b.className='mbadge done';}gUp();notif('★ MISSION '+id+' CLEAR! +'+MS.find(x=>x.id===id).coins+' COINS');if(sv.done.length>=5)setTimeout(showEnding,800);}

function showEnding(){
  if(document.getElementById('endingOverlay'))return;
  const el=document.createElement('div');el.id='endingOverlay';
  Object.assign(el.style,{position:'fixed',inset:'0',background:'rgba(0,0,0,0.92)',zIndex:'99999',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'18px',padding:'20px'});
  el.innerHTML=`
    <div style="font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.5vw,18px);color:#ffd700;text-shadow:3px 3px 0 #c00;text-align:center;line-height:2">★ ALL CLEAR! ★</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:clamp(6px,1.4vw,9px);color:#00e060;text-align:center;line-height:2">COINS รวม: ${sv.coins} 🪙<br>คุณผ่านทุก WORLD แล้ว!</div>
    <img src="img" style="max-width:min(680px,90vw);max-height:55vh;border:4px solid #ffd700;border-radius:6px;box-shadow:0 0 40px rgba(255,215,0,0.4)"/>
    <div style="font-family:'Press Start 2P',monospace;font-size:clamp(5px,1.2vw,7px);color:rgba(255,215,0,0.6);text-align:center;line-height:2">🎯 YOUR REWARD 🎯</div>
    <button onclick="document.getElementById('endingOverlay').remove()" style="font-family:'Press Start 2P',monospace;font-size:8px;background:#ffd700;color:#3a2000;border:none;border-radius:4px;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #7a5000">✕ CLOSE</button>
  `;
  document.body.appendChild(el);
}
function addDpad(w,id){if(!('ontouchstart' in window)&&!navigator.maxTouchPoints)return;const d=document.createElement('div');d.className='dpad';d.innerHTML=`<div class="dpad-row"><div class="dpempty"></div><div class="dpbtn" id="dU${id}">↑</div><div class="dpempty"></div></div><div class="dpad-row"><div class="dpbtn" id="dL${id}">←</div><div class="dpempty"></div><div class="dpbtn" id="dR${id}">→</div></div>`;w.appendChild(d);const map={U:' ',L:'ArrowLeft',R:'ArrowRight'};['U','L','R'].forEach(k=>{const el=document.getElementById('d'+k+id);if(!el)return;el.addEventListener('touchstart',e=>{e.preventDefault();const gs=gStates[id];if(gs&&gs.keys)gs.keys[map[k]]=true;},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();const gs=gStates[id];if(gs&&gs.keys)gs.keys[map[k]]=false;},{passive:false});});}

/* SHARED DRAW */
function dMario(ctx,px,py,pw,ph,flip){
  ctx.save();
  if(flip){ctx.translate(px+pw/2,py+ph/2);ctx.scale(1,-1);ctx.translate(-pw/2,-ph/2);}
  else ctx.translate(px,py);

  const cx=pw/2;

  // ── หัว (สูงมาก ~70%) ──
  ctx.fillStyle='#d4782e';
  ctx.fillRect(cx-pw*0.22, 0, pw*0.44, ph*0.70);

  // ── ลำตัว ──
  ctx.fillStyle='#c2692a';
  ctx.fillRect(cx-pw*0.28, ph*0.68, pw*0.56, ph*0.14);

  // ── ลายไม้ ──
  ctx.fillStyle='rgba(0,0,0,0.1)';
  for(let i=0;i<4;i++) ctx.fillRect(cx-pw*0.22+i*pw*0.13, ph*0.02, pw*0.04, ph*0.8);

  // ── ตาขาว ──
  ctx.fillStyle='#ffffff';
  ctx.fillRect(cx-pw*0.2,  ph*0.22, pw*0.15, ph*0.13);
  ctx.fillRect(cx+pw*0.05, ph*0.22, pw*0.15, ph*0.13);

  // ── ตาดำ ──
  ctx.fillStyle='#111111';
  ctx.fillRect(cx-pw*0.14, ph*0.24, pw*0.08, pw*0.09);
  ctx.fillRect(cx+pw*0.08, ph*0.24, pw*0.08, pw*0.09);

  // ── highlight ──
  ctx.fillStyle='#ffffff';
  ctx.fillRect(cx-pw*0.12, ph*0.24, pw*0.03, pw*0.03);
  ctx.fillRect(cx+pw*0.10, ph*0.24, pw*0.03, pw*0.03);

  // ── ปากยิ้ม (ไม่มีฟัน) ──
  ctx.fillStyle='#5a2000';
  ctx.fillRect(cx-pw*0.16, ph*0.54, pw*0.04, ph*0.05); // ซ้าย
  ctx.fillRect(cx+pw*0.12, ph*0.54, pw*0.04, ph*0.05); // ขวา
  ctx.fillRect(cx-pw*0.12, ph*0.58, pw*0.28, ph*0.03); // ล่าง

  // ── แขนซ้าย ──
  ctx.strokeStyle='#b05820';ctx.lineWidth=pw*0.07;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-pw*0.28,ph*0.72);ctx.lineTo(cx-pw*0.44,ph*0.83);ctx.stroke();

  // ── ไม้พลอง ──
  ctx.save();ctx.translate(cx+pw*0.15,ph*0.72);ctx.rotate(0.5);
  ctx.fillStyle='#8b4513';ctx.fillRect(-pw*0.06,0,pw*0.11,ph*0.36);
  ctx.fillStyle='#a0522d';ctx.fillRect(-pw*0.08,0,pw*0.04,ph*0.08);
  ctx.restore();

  // ── ขา ──
  ctx.strokeStyle='#b05820';ctx.lineWidth=pw*0.08;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-pw*0.12,ph*0.82);ctx.lineTo(cx-pw*0.14,ph*0.92);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+pw*0.12,ph*0.82);ctx.lineTo(cx+pw*0.14,ph*0.92);ctx.stroke();

  // ── เท้า ──
  ctx.fillStyle='#8b4513';
  ctx.fillRect(cx-pw*0.26,ph*0.90,pw*0.18,ph*0.07);
  ctx.fillRect(cx+pw*0.06,ph*0.90,pw*0.18,ph*0.07);

  ctx.restore();
}
function dStar(ctx,x,y,r,t,spd){ctx.save();ctx.translate(x,y);ctx.rotate(t*(spd||1));ctx.fillStyle='#ffd700';ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,b=a+Math.PI/5;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(b)*(r*.42),Math.sin(b)*(r*.42));}ctx.closePath();ctx.fill();ctx.restore();}

    goombas.forEach(g=>{if(g.dead){g.dieT++;return;}g.x+=g.vx;if(g.x<g.minX||g.x+g.w>g.maxX)g.vx*=-1;if(p.x<g.x+g.w&&p.x+p.w>g.x&&p.y<g.y+g.h&&p.y+p.h>g.y){if(p.vy>0&&p.y+p.h-p.vy<=g.y+3){g.dead=true;g.dieT=0;p.vy=-9;}else if(inv===0){lives--;inv=100;shX=8;shY=8;p={x:p.x,y:H-80,w:28,h:38,vx:0,vy:0,onGround:false,dead:false};document.getElementById('lv'+id).textContent=lives;if(lives<=0){stopM(id);notif('GOTCHA AGAIN 😈',true);setTimeout(()=>restartM(id),1500);return;}}}}); 
    parts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.3;pt.life--;});parts=parts.filter(pt=>pt.life>0);
    ctx.save();ctx.translate(shX*(Math.random()-.5)*2,shY*(Math.random()-.5)*2);
    skyBG(ctx,W,H,'#113366');
    plats.forEach((pl,i)=>{if(i===0)return;ctx.fillStyle='#5a3010';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle='#228b22';ctx.fillRect(pl.x,pl.y-6,pl.w,8);});
    stars.forEach(s=>{if(s.c)return;const pulse=Math.sin(t*(s.fake?9:1.8)+s.po)*.5+.5;if(s.fake){ctx.globalAlpha=.5+pulse*.5;dStar(ctx,s.x,s.y,11,t,4);ctx.globalAlpha=.18+pulse*.28;ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(s.x,s.y,16,0,Math.PI*2);ctx.fill();}else{ctx.globalAlpha=.55+pulse*.45;dStar(ctx,s.x,s.y,10,t,.5);}ctx.globalAlpha=1;});
    goombas.forEach(g=>{if(g.dieT<30)dGoomba(ctx,g);});
    parts.forEach(pt=>{ctx.globalAlpha=pt.life/40;ctx.fillStyle=pt.col;ctx.fillRect(pt.x-3,pt.y-3,6,6);ctx.globalAlpha=1;});
    if(inv===0||Math.floor(t*60)%8<4)dMario(ctx,p.x,p.y,p.w,p.h);
    ctx.restore();
    ctx.fillStyle='rgba(255,255,200,0.45)';ctx.font='9px serif';ctx.textAlign='left';ctx.fillText('slow blink=REAL | fast blink=DEATH 💥',8,14);
    aLoops[id]=requestAnimationFrame(loop);
  }
  gStates[id]={keys};aLoops[id]=requestAnimationFrame(loop);
}

/* MISSION 5 — BOWSER + ทุกอย่างพร้อมกัน */
function buildM5(cv,ctx,id){
  const W=640,H=300,keys={};
  const kd=e=>{keys[e.key]=true;['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key)&&e.preventDefault();};
  const ku=e=>{keys[e.key]=false;};
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  const SCS=[['ArrowLeft','ArrowRight',' '],['ArrowRight','ArrowLeft',' '],['a','d','ArrowUp'],['d','a',' ']];
  let sch=SCS[0],schT=0,schI=360,gravFlip=false,gravT=0,gravI=600;
  function mkFP(x,y,w){return{x,y,w,h:14,vy:0,fall:true,fallen:false,sT:0,oY:y};}
  let plats=[{x:0,y:H-40,w:W,h:40,fall:false,fallen:false,sT:0,oY:H-40,vy:0},mkFP(60,195,100),mkFP(220,150,110),mkFP(430,185,110),mkFP(150,95,90),mkFP(490,110,90)];
  let bowser={x:W-130,y:H-118,w:76,h:76,hp:5,invT:0,walkDir:-1};
  const fbs=[];let fireT=0;
  function mkFS(x,y,fake){return{x,y,fake,c:false,po:Math.random()*Math.PI*2,vx:fake?(Math.random()-.5)*1.5:0};}
  let stars=[mkFS(100,H-68,true),mkFS(280,126,true),mkFS(460,162,true),mkFS(170,70,false),mkFS(350,42,false),mkFS(520,88,false),mkFS(240,155,true),mkFS(390,185,true)];
  const goombas=[{x:180,y:H-62,w:28,h:28,vx:-2,minX:50,maxX:320,dead:false,dieT:0},{x:430,y:H-62,w:28,h:28,vx:2.2,minX:280,maxX:600,dead:false,dieT:0}];
  let p={x:30,y:H-80,w:28,h:38,vx:0,vy:0,onGround:false,dead:false};
  let lives=3,sc=0,t=0,inv=0,done=false,shX=0,shY=0,parts=[];
  document.getElementById('sc'+id).textContent='0';document.getElementById('lv'+id).textContent='3';document.getElementById('tm'+id).textContent='BOSS';
  setTimeout(()=>notif('👾 EVERYTHING IS WRONG — SURVIVE!',true),300);

  function aP(){return plats.filter(pl=>!pl.fallen);}
  function boom(x,y,col){shX=12;shY=12;for(let i=0;i<16;i++)parts.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:35,col:col||'#ff4400'});}

  function dBowser(b){
    const al=b.invT>0?(Math.floor(b.invT/4)%2?.3:1):1;ctx.globalAlpha=al;
    ctx.fillStyle='#2d8a00';ctx.fillRect(b.x,b.y+18,b.w,b.h-18);
    ctx.fillStyle='#3da800';ctx.fillRect(b.x+8,b.y,b.w-16,32);
    ctx.fillStyle='#ffd700';
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(b.x+14+i*22,b.y);ctx.lineTo(b.x+6+i*22,b.y-14);ctx.lineTo(b.x+22+i*22,b.y-14);ctx.closePath();ctx.fill();}
    ctx.fillStyle='#ff0000';ctx.fillRect(b.x+10,b.y+7,12,12);ctx.fillRect(b.x+b.w-22,b.y+7,12,12);
    ctx.fillStyle='#1a0a00';ctx.fillRect(b.x+15,b.y+11,5,5);ctx.fillRect(b.x+b.w-17,b.y+11,5,5);
    ctx.fillStyle='#ff0000';ctx.fillRect(b.x,b.y-16,b.w,8);
    ctx.fillStyle='#00ff00';ctx.fillRect(b.x,b.y-16,b.w*(b.hp/5),8);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(b.x,b.y-16,b.w,8);
    ctx.globalAlpha=1;
  }

  function loop(){
    if(!document.getElementById('gw'+id)){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);return;}
    t+=0.016;schT++;gravT++;
    if(schT>=schI){schT=0;sch=SCS[Math.floor(Math.random()*SCS.length)];schI=260+Math.random()*180;shX=8;shY=8;}
    if(gravT>=gravI){gravT=0;gravFlip=!gravFlip;gravI=380+Math.random()*280;shX=14;shY=14;notif(gravFlip?'⚠ GRAVITY FLIP!':'⚠ GRAVITY BACK!',true);}
    shX*=0.85;shY*=0.85;
    const gv=gravFlip?-0.56:0.56;
    const L=keys[sch[0]],R=keys[sch[1]];
    const J=keys[' ']||keys['ArrowUp']||keys['w']; // jump ใช้ space/↑ เสมอ ไม่ขึ้นกับ scheme
    if(L)p.vx=-4.8;else if(R)p.vx=4.8;else p.vx*=0.72;
    if(J&&p.onGround){p.vy=gravFlip?13:-13;p.onGround=false;}
    // custom physics for grav flip
    p.vy+=gv;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=0;if(p.x+p.w>W)p.x=W-p.w;p.onGround=false;
    aP().forEach(pl=>{if(p.x<pl.x+pl.w&&p.x+p.w>pl.x&&p.y<pl.y+pl.h&&p.y+p.h>pl.y){const ox=Math.min(p.x+p.w-pl.x,pl.x+pl.w-p.x),oy=Math.min(p.y+p.h-pl.y,pl.y+pl.h-p.y);if(oy<ox){if(gv>0){if(p.vy>0&&p.y+p.h-p.vy<=pl.y+3){p.y=pl.y-p.h;p.vy=0;p.onGround=true;}else if(p.vy<0){p.y=pl.y+pl.h;p.vy=0;}}else{if(p.vy<0&&p.y-p.vy>=pl.y+pl.h-3){p.y=pl.y+pl.h;p.vy=0;p.onGround=true;}else if(p.vy>0){p.y=pl.y-p.h;p.vy=0;}}}else{p.x+=p.vx>0?-ox:ox;p.vx=0;}}});
    if(p.y>H+60||p.y<-60)p.dead=true;

    // falling plats
    plats.forEach((pl,i)=>{if(i===0||!pl.fall||pl.fallen)return;const onIt=p.x<pl.x+pl.w&&p.x+p.w>pl.x&&((gv>0&&Math.abs(p.y+p.h-pl.y)<6)||(gv<0&&Math.abs(p.y-pl.y-pl.h)<6))&&p.onGround;if(onIt){pl.sT++;if(pl.sT>22)pl.vy=gv>0?.12:-.12;}if(Math.abs(pl.vy)>.01){pl.vy+=gv*.4;pl.y+=pl.vy;if(pl.y>H+60||pl.y<-60){pl.fallen=true;setTimeout(()=>{pl.y=pl.oY;pl.vy=0;pl.fallen=false;pl.sT=0;},4000);}}});

    // Bowser walk + shoot
    bowser.x+=bowser.walkDir*1.8;if(bowser.x<W/2-150||bowser.x+bowser.w>W-4)bowser.walkDir*=-1;
    if(bowser.invT>0)bowser.invT--;
    fireT++;if(fireT>Math.max(30,65-bowser.hp*10)){
      fbs.push({x:bowser.x,y:bowser.y+bowser.h/2,vx:-5-Math.random()*3,vy:(Math.random()-.5)*5,r:9});
      if(bowser.hp<=2)fbs.push({x:bowser.x+bowser.w/2,y:bowser.y+bowser.h*.3,vx:-3.5,vy:3.5,r:8});
      fireT=0;
    }
    fbs.forEach(fb=>{fb.x+=fb.vx;fb.y+=fb.vy;fb.vy+=.25;if(fb.y>H-40){fb.vy*=-.65;fb.y=H-40-fb.r;}});
    fbs.forEach(fb=>{if(inv===0&&p.x<fb.x+fb.r&&p.x+p.w>fb.x-fb.r&&p.y<fb.y+fb.r&&p.y+p.h>fb.y-fb.r){lives--;inv=100;boom(fb.x,fb.y,'#ff6600');document.getElementById('lv'+id).textContent=lives;if(lives<=0){stopM(id);notif('BOWSER WINS 😈',true);setTimeout(()=>restartM(id),1500);return;}}});

    // Stomp Bowser
    if(bowser.hp>0&&bowser.invT===0&&p.x<bowser.x+bowser.w&&p.x+p.w>bowser.x&&p.y<bowser.y+bowser.h&&p.y+p.h>bowser.y){
      const stompOk=gv>0?(p.vy>0&&p.y+p.h-p.vy<=bowser.y+5):(p.vy<0&&p.y-p.vy>=bowser.y+bowser.h-5);
      if(stompOk){bowser.hp--;bowser.invT=90;p.vy=gv>0?-13:13;boom(bowser.x+38,bowser.y+38,'#ffd700');document.getElementById('sc'+id).textContent='HIT '+(5-bowser.hp)+'/5';if(bowser.hp<=0&&!done){done=true;setTimeout(()=>clearM(id),900);}}
      else if(inv===0){lives--;inv=100;document.getElementById('lv'+id).textContent=lives;if(lives<=0){stopM(id);notif('STOMPED 😈',true);setTimeout(()=>restartM(id),1500);return;}}
    }

    // Fake stars
    stars.forEach(s=>{if(s.c)return;s.x+=s.vx;if(s.x<18||s.x>W-18)s.vx*=-1;if(Math.abs(p.x+13-s.x)<18&&Math.abs(p.y+17-s.y)<18){s.c=true;if(s.fake){boom(s.x,s.y,'#ff2200');lives--;document.getElementById('lv'+id).textContent=lives;notif('💥 FAKE!',true);if(lives<=0){stopM(id);notif('BOOM 😈',true);setTimeout(()=>restartM(id),1500);return;}}}});

    // Invisible goombas (2 lives penalty)
    goombas.forEach(g=>{if(g.dead){g.dieT++;return;}g.x+=g.vx;if(g.x<g.minX||g.x+g.w>g.maxX)g.vx*=-1;if(p.x<g.x+g.w&&p.x+p.w>g.x&&p.y<g.y+g.h&&p.y+p.h>g.y){if(p.vy>0&&p.y+p.h-p.vy<=g.y+3){g.dead=true;g.dieT=0;p.vy=-9;}else if(inv===0){lives=Math.max(0,lives-2);inv=100;document.getElementById('lv'+id).textContent=lives;notif('invisible goomba -2❤️',true);if(lives<=0){stopM(id);notif('invisible goomba wins 😈',true);setTimeout(()=>restartM(id),1500);return;}}}});

    if(p.dead){lives--;p={x:30,y:H-80,w:28,h:38,vx:0,vy:0,onGround:false,dead:false};inv=100;document.getElementById('lv'+id).textContent=lives;if(lives<=0){stopM(id);notif('😈😈😈',true);setTimeout(()=>restartM(id),1500);return;}}
    if(inv>0)inv--;
    parts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=.2;pt.life--;});parts=parts.filter(pt=>pt.life>0);

    // DRAW
    const sx=shX*(Math.random()-.5)*2,sy=shY*(Math.random()-.5)*2;
    ctx.save();ctx.translate(sx,sy);if(gravFlip){ctx.translate(W/2,H/2);ctx.scale(1,-1);ctx.translate(-W/2,-H/2);}
    ctx.fillStyle='#1a0000';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(80,0,0,0.38)';for(let i=0;i<W;i+=80)ctx.fillRect(i,0,40,H);
    ctx.fillStyle='#5a1010';ctx.fillRect(0,H-40,W,40);ctx.fillStyle='#7a2020';for(let x2=0;x2<W;x2+=40)ctx.fillRect(x2,H-40,38,7);

    plats.forEach((pl,i)=>{if(pl.fallen||i===0)return;const sh2=pl.sT>18?Math.sin(t*30)*(pl.sT-18)*.25:0;ctx.fillStyle='#8b4a00';ctx.fillRect(pl.x+sh2,pl.y,pl.w,pl.h);if(pl.sT>12){ctx.fillStyle='rgba(255,90,0,.4)';ctx.fillRect(pl.x+sh2,pl.y,pl.w,pl.h);}});

    // Shadow for invis goombas
    goombas.forEach(g=>{if(g.dead)return;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(g.x+g.w/2,H-41,g.w/2,5,0,0,Math.PI*2);ctx.fill();});

    // Stars
    stars.forEach(s=>{if(s.c)return;const pulse=Math.sin(t*(s.fake?9:1.5)+s.po)*.5+.5;if(s.fake){ctx.globalAlpha=.5+pulse*.5;dStar(ctx,s.x,s.y,11,t,4);ctx.globalAlpha=.15+pulse*.22;ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(s.x,s.y,17,0,Math.PI*2);ctx.fill();}else{ctx.globalAlpha=.55+pulse*.45;dStar(ctx,s.x,s.y,10,t,.5);}ctx.globalAlpha=1;});

    // Fireballs
    fbs.forEach(fb=>{ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(fb.x,fb.y,fb.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(fb.x,fb.y,fb.r*.48,0,Math.PI*2);ctx.fill();});

    if(bowser.hp>0)dBowser(bowser);
    else{ctx.fillStyle='#ffd700';ctx.font='bold 16px serif';ctx.textAlign='center';ctx.fillText('💀 DEFEATED!',bowser.x+38,bowser.y+40);}
    parts.forEach(pt=>{ctx.globalAlpha=pt.life/35;ctx.fillStyle=pt.col;ctx.fillRect(pt.x-3,pt.y-3,6,6);ctx.globalAlpha=1;});
    if(inv===0||Math.floor(t*60)%8<4)dMario(ctx,p.x,p.y,p.w,p.h,gravFlip);
    ctx.restore();
    ctx.fillStyle='rgba(255,80,0,.65)';ctx.font='8px serif';ctx.textAlign='left';
    if(schT<50)ctx.fillText('controls changed!',8,14);
    if(gravT<50)ctx.fillText(gravFlip?'⚠ FLIPPED':'⚠ NORMAL',8,26);
    document.getElementById('xt'+id).textContent=gravFlip?'[FLIP]':'';
    aLoops[id]=requestAnimationFrame(loop);
  }
  gStates[id]={keys};aLoops[id]=requestAnimationFrame(loop);
}

/* BGM — เล่นทันทีที่ผู้ใช้ interact ครั้งแรก */
(function(){
  const bgm = new Audio('bgm_secret.mp3');
  bgm.loop = true;
  bgm.volume = 0.45;

  // มิ่งขวัญ UI — ปุ่ม mute ลอยมุมขวาล่าง
  const btn = document.createElement('button');
  btn.id = 'bgmBtn';
  btn.textContent = '♪';
  btn.title = 'Toggle Music';
  Object.assign(btn.style, {
    position:'fixed', bottom:'70px', right:'14px', zIndex:'9999',
    fontFamily:"'Press Start 2P',monospace", fontSize:'11px',
    background:'rgba(10,0,30,0.88)', color:'#ffd700',
    border:'2px solid #ffd700', borderRadius:'4px',
    padding:'6px 10px', cursor:'pointer',
    boxShadow:'0 3px 0 #7a5000', transition:'opacity .2s',
  });
  document.body.appendChild(btn);

  let playing = false;
  let started = false;

  function startBGM(){
    if(started) return;
    started = true;
    bgm.play().then(()=>{
      playing = true;
      btn.textContent = '♪ ON';
    }).catch(()=>{});
  }

  // เล่นทันทีที่แตะ/คลิกครั้งแรก
  ['click','keydown','touchstart'].forEach(ev=>{
    document.addEventListener(ev, startBGM, {once:true, passive:true});
  });

  btn.addEventListener('click', e=>{
    e.stopPropagation();
    startBGM();
    if(playing){ bgm.pause(); playing=false; btn.textContent='♪ OFF'; btn.style.opacity='0.45'; }
    else { bgm.play(); playing=true; btn.textContent='♪ ON'; btn.style.opacity='1'; }
  });
})();
